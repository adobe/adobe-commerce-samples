operations:
  view:
    - type: web
      impl: index.html
actions: actions
web: web-src
hooks:
  post-app-deploy: node scripts/setup-database.js
runtimeManifest:
  packages:
    supplier-catalog:
      license: Apache-2.0
      actions:
        catalog:
          function: actions/catalog/index.js
          web: 'yes'
          runtime: nodejs:22
          inputs:
            DB_REGION: $DB_REGION
          limits:
            timeout: 60000
            memory: 256
          annotations:
            require-adobe-auth: true
            include-ims-credentials: true
            final: true
